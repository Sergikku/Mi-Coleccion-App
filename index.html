<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Colección App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05060a">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Colección">
<!-- v10.2: JSZip (3.10.1, la misma versión que antes venía del CDN) y la
     fuente Space Grotesk (v2.000, licencia OFL — ver OFL.txt) se sirven
     desde la propia app: funcionan sin conexión y ya no bloquean el arranque
     esperando a servidores externos. -->
<script src="jszip.min.js" defer></script>
<link rel="preload" href="SpaceGrotesk-VF.woff2" as="font" type="font/woff2" crossorigin>
<!-- v11.0.1: todos los archivos van en la raíz, sin carpetas (se suben de uno en uno a GitHub).
     Los archivos de la app llevan ?v=<versión>: al publicar una versión nueva,
     el navegador y el service worker piden los nuevos y nunca mezclan HTML nuevo
     con JS/CSS viejo. Mantener igual que APP_VERSION (util.js) y CACHE_NAME (sw.js). -->
<link rel="stylesheet" href="app.css?v=11.0.1">
<script>
  /* Tema antes del primer pintado (evita el destello del tema claro al abrir en oscuro).
     La preferencia real vive en tus datos; esto es solo una copia rápida local. */
  try{ if(localStorage.getItem('coleccion-theme')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
</script>
</head>
<body>
<a class="skip-link" id="skipLink" href="#panel">Saltar al contenido</a>
<div class="shell">
  <header class="topbar">
    <button type="button" class="brand" id="brandBtn" onclick="goPage('dashboard')"><span class="lens" aria-hidden="true"></span><span class="brand-text">La Colección <b>App</b></span></button>
    <div class="topbar-actions">
      <button type="button" id="searchToggle" class="round-btn round-search" onclick="openInventorySearch('')"></button>
      <button type="button" id="themeToggle" class="round-btn theme-toggle" onclick="toggleTheme()"></button>
      <button type="button" id="settingsToggle" class="round-btn round-settings" onclick="openSettings()" aria-haspopup="dialog"></button>
    </div>
  </header>
  <nav class="topnav" id="topnav" aria-label="Secciones"></nav>
  <div class="subbar" id="subbar" hidden>
    <button type="button" id="backBtn" class="back-btn" onclick="navBack()"></button>
    <nav class="crumbs" id="crumbs" aria-label="Ruta"></nav>
  </div>
  <main class="frame"><div class="frame-inner" id="panel" tabindex="-1"></div></main>
  <span class="app-version-corner" aria-hidden="true">v.11.0.1</span>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Secciones"></nav>
<button type="button" id="fab" class="fab" style="display:none;" onclick="fabAction()"></button>
<div id="pinchOverlay" class="pinch-overlay" onclick="if(event.target===this && typeof isViewerOpen==='function' && isViewerOpen()) closePhotoViewer()">
  <img id="pinchImg" alt="">
  <button type="button" id="viewerClose" class="round-btn viewer-close" onclick="closePhotoViewer()" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div id="viewerBar" class="viewer-bar" hidden></div>
</div>
<div id="tourOverlay"></div>
<div id="sheetOverlay" class="sheet-overlay"></div>
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="modalCancelAction()" id="modalCancelBtn"></button>
      <button type="button" class="btn primary" onclick="modalConfirmAction()" id="modalOkBtn"></button>
    </div>
  </div>
</div>
<div id="toastRegion" class="toast-region" role="status" aria-live="polite"></div>

<script src="util.js?v=11.0.1"></script>
<script src="i18n.js?v=11.0.1"></script>
<script src="storage.js?v=11.0.1"></script>
<script src="model.js?v=11.0.1"></script>
<script src="ui.js?v=11.0.1"></script>
<script src="screens.js?v=11.0.1"></script>
<script src="actions.js?v=11.0.1"></script>
<script src="backup.js?v=11.0.1"></script>
<script src="app.js?v=11.0.1"></script>
</body>
</html>

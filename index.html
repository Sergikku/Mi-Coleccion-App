  const complete = isComplete(rec.product, rec.edition);
  const el = document.getElementById('completo_'+id);
  if(!el) return;
  el.style.display = complete===null ? 'none' : '';
  el.className = 'completo-badge ' + (complete ? 'completo-yes' : 'completo-no');
  el.textContent = t('p.complete') + ': ' + (complete ? t('p.yes') : t('p.no'));
}
function refreshProductMeta(id){
  const p = PRODUCTS_BY_ID[id]; if(!p) return;
  const el = document.getElementById('product-meta-'+id);
  if(el) el.innerHTML = productMetaHTML(p);
}

/* ----- Inventario ----- */
async function renderInventario(){
  let eds = allEditions();
  if(invState.search){
    const q = invState.search.toLowerCase();
    eds = eds.filter(x => (x.product.name+' '+(x.product.platformName||'')+' '+(x.edition.region||'')).toLowerCase().includes(q));
  }
  if(invState.filter==='tengo') eds = eds.filter(x=>x.edition.possession==='tengo');
  if(invState.filter==='falta') eds = eds.filter(x=>x.edition.possession!=='tengo');
  if(invState.filter==='sinconfirmar') eds = eds.filter(x=>x.edition.existence!=='confirmado');
  if(invState.filter==='sellado') eds = eds.filter(x=>x.edition.sealed);

  eds.sort((a,b)=>{
    if(invState.sort==='anio'){
      const ya = parseInt(a.edition.year,10); const yb = parseInt(b.edition.year,10);
      const na = isNaN(ya)?9999:ya; const nb = isNaN(yb)?9999:yb;
      if(na!==nb) return na-nb;
      return a.product.name.localeCompare(b.product.name,'es',{sensitivity:'base'});
    }
    if(invState.sort==='nombre') return a.product.name.localeCompare(b.product.name,'es',{sensitivity:'base'});
    if(invState.sort==='plataforma') return (a.product.platformName||'').localeCompare(b.product.platformName||'','es',{sensitivity:'base'});
    return 0;
  });

  const total = eds.length;
  const shown = eds.slice(0, invState.limit);

  let html = `<div class="kicker"><span class="dot"></span> ${t('inv.kicker')}</div><h1>${t('inv.title')}</h1>`;
  html += `<div class="searchbar"><input type="text" placeholder="${t('inv.search.ph')}" value="${invState.search.replace(/"/g,'&quot;')}" oninput="invSearch(this.value)"></div>`;
  html += `<div class="chip-row">
    ${chip(t('inv.chip.all'),'todos')}${chip(t('inv.chip.have'),'tengo')}${chip(t('inv.chip.missing'),'falta')}${chip(t('inv.chip.unconfirmed'),'sinconfirmar')}${chip(t('inv.chip.sealed'),'sellado')}
  </div>`;
  html += `<div class="chip-row">
    <select onchange="invSort(this.value)" style="font-family:inherit;font-size:11px;padding:7px 10px;border-radius:16px;border:1px solid var(--line);background:var(--field-bg);color:var(--ink);">
      <option value="anio" ${invState.sort==='anio'?'selected':''}>${t('inv.sort.year')}</option>
      <option value="nombre" ${invState.sort==='nombre'?'selected':''}>${t('inv.sort.name')}</option>
      <option value="plataforma" ${invState.sort==='plataforma'?'selected':''}>${t('inv.sort.platform')}</option>
    </select>
  </div>`;
  html += `<div class="section-sub">${total} ${t('inv.results')}</div>`;
  if(invState.filter==='falta' && total>0) html += `<button class="btn" onclick="printMissingList()">${icon('archive')} ${t('inv.print_missing')}</button>`;

  const photoPairs = await Promise.all(shown.map(async x=>[await loadMainFront(x.product.id), await loadMainBack(x.product.id)]));
  shown.forEach((x,i)=>{
    html += `<div class="inv-item" onclick="goProduct('${x.product.id}')" style="cursor:pointer;">
      ${flipViewHTML(photoPairs[i][0], photoPairs[i][1])}
      <div>
        <div class="inv-name">${x.product.name}</div>
        <div class="inv-meta">${x.edition.region||'—'} · ${x.edition.year||'—'} · ${possessionLabel(x.edition.possession)}</div>
        <div class="inv-id">${x.edition.id}</div>
      </div>
      <div class="badge ${x.edition.possession==='tengo'?'badge-possess-yes':'badge-possess-no'}">${x.edition.possession==='tengo'?t('inv.have'):t('inv.missing')}</div>
    </div>`;
  });
  if(total > invState.limit){
    html += `<button class="btn load-more" onclick="invState.limit+=60; render();">${t('inv.load_more').replace('{n}', total - invState.limit)}</button>`;
  }
  return html;
}
function chip(label, val){ return `<button class="chip ${invState.filter===val?'active':''}" onclick="invFilter('${val}')">${label}</button>`; }
function invSearch(v){ invState.search=v; invState.limit=60; render(); }

/* Genera una lista imprimible de lo que te falta, agrupada por categoría —
   el propio navegador la deja guardar como PDF desde el diálogo de
   imprimir, sin necesitar ninguna librería aparte. */
function printMissingList(){
  const missing = allEditions().filter(x=>x.edition.possession!=='tengo');
  const byCat = {};
  missing.forEach(x=>{
    const catName = (getAllCategories().find(c=>c.id===x.product.categoryId)||{}).name || '—';
    if(!byCat[catName]) byCat[catName] = [];
    byCat[catName].push(x);
  });
  const title = t('inv.print_title');
  let body = `<h1>${title}</h1><div class="sub">${missing.length} ${t('inv.results')} — ${new Date().toLocaleDateString()}</div>`;
  Object.keys(byCat).sort().forEach(catName=>{
    body += `<h2>${catName}</h2><ul>`;
    byCat[catName].sort((a,b)=>a.product.name.localeCompare(b.product.name,'es',{sensitivity:'base'})).forEach(x=>{
      body += `<li><span class="box"></span> ${x.product.name}${x.product.platformName?' — '+x.product.platformName:''}${x.edition.year?' ('+x.edition.year+')':''}</li>`;
    });
    body += `</ul>`;
  });
  const w = window.open('', '_blank');
  if(!w) return;
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title><style>
    body{font-family:Georgia,serif;padding:30px;color:#222;max-width:700px;margin:0 auto;}
    h1{font-size:22px;margin-bottom:4px;} .sub{color:#777;font-size:12px;margin-bottom:24px;}

/* Diálogo propio para pedir texto o confirmar acciones — funciona igual
   dentro de una PWA instalada que en el navegador normal, a diferencia de
   prompt()/confirm() nativos. */
let modalResolve = null;
function showPromptModal(title, defaultValue){
  return new Promise(resolve=>{
    modalResolve = resolve;
    document.getElementById('modalTitle').textContent = title;
    const input = document.getElementById('modalInput');
    input.style.display = 'block';
    input.value = defaultValue || '';
    document.getElementById('modalOkBtn').textContent = t('modal.accept');
    document.getElementById('modalCancelBtn').textContent = t('modal.cancel');
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(()=>{ input.focus(); input.select(); }, 60);
  });
}
function showConfirmModal(message){
  return new Promise(resolve=>{
    modalResolve = resolve;
    document.getElementById('modalTitle').textContent = message;
    document.getElementById('modalInput').style.display = 'none';
    document.getElementById('modalOkBtn').textContent = t('modal.confirm');
    document.getElementById('modalCancelBtn').textContent = t('modal.cancel');
    document.getElementById('modalOverlay').classList.add('open');
  });
}
function modalConfirmAction(){
  const input = document.getElementById('modalInput');
  const isPrompt = input.style.display !== 'none';
  const value = isPrompt ? (input.value.trim() || null) : true;
  document.getElementById('modalOverlay').classList.remove('open');
  const resolve = modalResolve; modalResolve = null;
  if(resolve) resolve(value);
}
function modalCancelAction(){
  document.getElementById('modalOverlay').classList.remove('open');
  const resolve = modalResolve; modalResolve = null;
  if(resolve) resolve(null);
}

}

/* Instantánea portable: cada ficha se guarda ya resuelta del todo (nombre,
   año, checklist, posesión, resumen, todo) en vez de guardar solo "lo que
   cambiaste" — así funciona igual da igual si quien la reciba tiene tu
   catálogo de ejemplo cargado en el código o no tiene ninguno. Es lo que
   usa tanto "Exportar todo" como el JSON suelto. */
function buildPortableSnapshot(){
  const snapshot = {
    products: {}, editions: {},
    customCategories: getAllCategories().map(c=>({ id:c.id, name:c.name })),
    customPlatforms: getAllPlatforms().map(p=>({ id:p.id, categoryId:p.categoryId, year:p.year, name:p.name, maker:p.maker, code:p.code })),
    customProducts: [],
    folders: OVERRIDES.folders || {},
    categoryChecklist: OVERRIDES.categoryChecklist || {},
    platformFlags: OVERRIDES.platformFlags || {},
    categoryOrder: OVERRIDES.categoryOrder || {},
    theme: OVERRIDES.theme || 'light',
    dashboardTitle: OVERRIDES.dashboardTitle || '',
    tourSeen: true,
    seedEnabled: false,
  };
  PRODUCTS.forEach(p=>{
    snapshot.customProducts.push(Object.assign({}, p));
    snapshot.products[p.id] = Object.assign({}, p);
  });
  return snapshot;
}
/* Paquete completo: el HTML de la app tal cual está corriendo ahora mismo
   (código incluido) + tus datos + todas tus fotos, todo en un único ZIP.
   Pensado como copia de seguridad "de todo" y como punto de partida para
   el día que esto se convierta en una app instalable de verdad — lo que
   sea que la reciba, esto es lo que necesita para reconstruir tu colección
   completa, tenga o no tenga tu catálogo de ejemplo ya cargado. */
async function exportEverything(){
  const statusEl = document.getElementById('everything-export-status');
  if(typeof JSZip === 'undefined'){
    if(statusEl) statusEl.textContent = 'No se pudo cargar la librería para comprimir (revisa tu conexión a internet) — inténtalo de nuevo.';
    return;
  }
  if(statusEl) statusEl.textContent = 'Preparando el paquete completo (puede tardar unos segundos si tienes muchas fotos)…';
  const zip = new JSZip();

  // 1) El código de la app tal cual está en este momento
  const appHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  zip.file('la-coleccion-app.html', appHtml);

  // 2) Tus datos, como instantánea completa e independiente
  zip.file('datos.json', JSON.stringify(buildPortableSnapshot(), null, 2));

  // 3) Todas tus fotos, en su propia carpeta
  const { keys, vals } = await idbGetAll(PHOTOS_STORE);
  let addedPhotos = 0;
  keys.forEach((key, i)=>{
    const dataUrl = vals[i];
    if(!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:')) return;
    const m = dataUrl.match(/^data:([^;]+);base64,([\s\S]*)$/);
    if(!m) return;
    const mime = m[1], base64 = m[2];
    const ext = mime.includes('png') ? 'png' : mime.includes('webp') ? 'webp' : 'jpg';
    zip.file('fotos/' + key + '.' + ext, base64, {base64:true});
    addedPhotos++;
  });

  const blob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'la-coleccion-app-completo-' + new Date().toISOString().slice(0,10) + '.zip';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  if(statusEl) statusEl.textContent = 'Listo: app + datos + ' + addedPhotos + ' foto(s) en un único ZIP. Guárdalo en un sitio seguro.';
}

async function importPhotosZip(input){
  const file = input.files[0];
  if(!file) return;
  const statusEl = document.getElementById('photo-export-status');
  if(typeof JSZip === 'undefined'){
    if(statusEl) statusEl.textContent = 'No se pudo cargar la librería para descomprimir — revisa tu conexión e inténtalo de nuevo.';
    return;
  }
  try{
    if(statusEl) statusEl.textContent = 'Importando fotos…';
    const zip = await JSZip.loadAsync(file);
    const entries = Object.keys(zip.files).filter(n=>!zip.files[n].dir);
    let count = 0;
    for(const name of entries){
      const dotIdx = name.lastIndexOf('.');
      if(dotIdx<0) continue;
      const key = name.slice(0, dotIdx);
      const ext = name.slice(dotIdx+1).toLowerCase();
      const mime = ext==='png' ? 'image/png' : ext==='webp' ? 'image/webp' : 'image/jpeg';
      const base64 = await zip.files[name].async('base64');
      await idbSet(PHOTOS_STORE, key, 'data:'+mime+';base64,'+base64);
      count++;
    }
    if(statusEl) statusEl.textContent = count + ' foto(s) importada(s) correctamente en este navegador.';
    render();
  }catch(err){
    if(statusEl) statusEl.textContent = 'No se pudo importar el ZIP: ' + err.message;
  }
}

/* ---------- Tour guiado de bienvenida ---------- */
/* Aparece la primera vez que se abre esta copia del archivo (a la vez que
   el estado en blanco, sin datos de ejemplo). Guía a la persona a crear de
   verdad una categoría, una plataforma y un objeto — no son diapositivas,
   avanza solo cuando la acción real ha ocurrido. */
let tourActive = false;
let tourStep = 0;
const TOUR_STEPS = [
  { type:'modal', icon:'layers', titleKey:'tour.welcome.title', bodyKey:'tour.welcome.body', ctaKey:'tour.welcome.cta' },
  { type:'action', icon:'layers', navigate:()=>goPage('coleccion'), selector:'#tour-add-category',
    bodyKey:'tour.category.body',
    done:()=> (OVERRIDES.customCategories||[]).length>0 },
  { type:'action', icon:'plusCircle', selector:'#fab',
    bodyKey:'tour.platform.body',
    done:()=> (OVERRIDES.customPlatforms||[]).length>0 },
  { type:'action', icon:'folder', selector:'#tour-add-folder',
    bodyKey:'tour.folder.body',
    done:()=> Object.values(OVERRIDES.folders||{}).some(arr=>arr && arr.length>0) },
  { type:'action', icon:'plusCircle', selector:'#fab',
    bodyKey:'tour.object.body',
    done:()=> (OVERRIDES.customProducts||[]).length>0 },
  { type:'modal', icon:'checkCircle', titleKey:'tour.final.title', bodyKey:'tour.final.body', ctaKey:'tour.final.cta' },
];
async function startTour(){
  tourActive = true;
  tourStep = 0;
  renderTourOverlay();
}
async function tourNext(){
  if(tourStep >= TOUR_STEPS.length - 1){ await finishTour(); return; }
  tourStep++;
  const next = TOUR_STEPS[tourStep];
  if(next.navigate) next.navigate(); else renderTourOverlay();
}
async function finishTour(){
  tourActive = false;
  OVERRIDES.tourSeen = true;
  await persistOverrides();
  clearTourHighlight();
  const c = document.getElementById('tourOverlay'); if(c) c.innerHTML = '';
}
function clearTourHighlight(){
  document.querySelectorAll('.tour-spotlight, .tour-spotlight-fixed').forEach(el=> el.classList.remove('tour-spotlight','tour-spotlight-fixed'));
}
function advanceTourIfDone(){
  const step = TOUR_STEPS[tourStep];
  if(step && step.type==='action' && step.done && step.done()) tourStep++;
  renderTourOverlay();
}
function renderTourOverlay(){
  const container = document.getElementById('tourOverlay');
  if(!container) return;
  clearTourHighlight();
  if(!tourActive){ container.innerHTML = ''; return; }
  const step = TOUR_STEPS[tourStep];
  if(!step) return;
  if(step.type==='modal'){
    container.innerHTML = `<div class="tour-modal-backdrop">
      <div class="tour-modal">
        <div class="tour-modal-icon">${icon(step.icon)}</div>
        <div class="tour-modal-title">${t(step.titleKey)}</div>
        <div class="tour-modal-body">${t(step.bodyKey)}</div>
        <button class="btn primary" style="width:100%;" onclick="tourNext()">${t(step.ctaKey)}</button>
        ${tourStep===0 ? `<button class="tour-skip" style="margin-top:12px;" onclick="finishTour()">${t('tour.skip')}</button>` : ``}
      </div>
    </div>`;
  } else {
    const target = document.querySelector(step.selector);
    if(target){
      // el "+" flotante ya tiene su propia posición fija en pantalla — si le
      // forzamos position:relative para el halo, se sale de su sitio. Para
      // botones normales (posición estática) sí hace falta forzarla.
      const isFixedEl = window.getComputedStyle(target).position !== 'static';
      target.classList.add(isFixedEl ? 'tour-spotlight-fixed' : 'tour-spotlight');
    }
    const actionSteps = TOUR_STEPS.filter(s=>s.type==='action');
    const stepNum = TOUR_STEPS.slice(0, tourStep+1).filter(s=>s.type==='action').length;
    const dots = actionSteps.map((s,i)=> `<span class="tour-dot ${i<stepNum?'tour-dot-done':''} ${i===stepNum-1?'tour-dot-current':''}"></span>`).join('');
    container.innerHTML = `<div class="tour-caption">
      <div class="tour-caption-head">
        <span class="tour-caption-icon">${icon(step.icon)}</span>
        <div class="tour-dots">${dots}</div>
      </div>
      <div class="tour-caption-text">${t(step.bodyKey)}</div>
      <div class="tour-caption-foot"><span class="tour-caption-count">${t('tour.step')} ${stepNum} ${t('tour.of')} ${actionSteps.length}</span><button class="tour-skip" onclick="finishTour()">${t('tour.skip')}</button></div>
    </div>`;
  }
}

/* ---------- INIT ---------- */
/* Tema claro/oscuro — se guarda en el mismo sitio que el resto de tus
   ajustes, así que se recuerda la próxima vez que abras el archivo. */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme==='dark' ? 'dark' : 'light');
  const btn = document.getElementById('themeToggle');
  if(btn){
    // en oscuro se ofrece pasar a claro (icono sol, tono dorado) y viceversa
    // (icono luna, tono azul) — el color representa lo que vas a activar.
    btn.innerHTML = icon(theme==='dark' ? 'sun' : 'moon');
    btn.classList.remove('mode-sun','mode-moon');
    btn.classList.add(theme==='dark' ? 'mode-sun' : 'mode-moon');
  }
}
async function toggleTheme(){
  const current = OVERRIDES.theme === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  OVERRIDES.theme = next;
  applyTheme(next);
  await persistOverrides();
}

async function init(){
  await ensureOverridesLoaded();
  applyTheme(OVERRIDES.theme === 'dark' ? 'dark' : 'light');
  const langBtn = document.getElementById('langToggle');
  if(langBtn) langBtn.innerHTML = icon('globe');
  const currencyBtn = document.getElementById('currencyToggle');
  if(currencyBtn) currencyBtn.textContent = currencySymbol();
  buildProducts();
  attachFlipHandlers();
  render();
  if(!OVERRIDES.tourSeen) startTour();
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* si falla, la app sigue funcionando igual, solo sin modo sin-conexión */ });
  });
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>La Colección App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#131d30">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Colección">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --paper:#f1ede3; --navy:#1c2a42; --navy-deep:#131d30; --ink:#23262b; --heading:#1c2a42;
    --brick:#a3543f; --sage:#7c9473; --gold:#b8925a; --line: rgba(28,42,66,0.14);
    --green-yes:#5c7d54; --red-no:#a3543f; --amber:#b8873f; --violet:#6b5b95;
    --ink-dim: rgba(35,38,43,0.55); --card-bg: rgba(255,255,255,0.45); --card-bg-active: rgba(255,255,255,0.85);
    --field-bg: #ffffff;
  }
  html[data-theme="dark"]{
    --paper:#141d2c; --navy:#3a5a8c; --navy-deep:#0a0f18; --ink:#e9e6dd; --heading:#e9e6dd;
    --line: rgba(255,255,255,0.1);
    --ink-dim: rgba(233,230,221,0.55); --card-bg: rgba(255,255,255,0.045); --card-bg-active: rgba(255,255,255,0.09);
    --field-bg: #1b263a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--navy-deep);background-image:radial-gradient(circle at 15% 0%, rgba(255,255,255,0.04), transparent 45%);min-height:100vh;font-family:'IBM Plex Mono', monospace;color:var(--ink);padding:16px 12px 90px;-webkit-overflow-scrolling:touch;}
  .shell{max-width:1100px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .lens{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #fff 0%, var(--brick) 40%, #6b2f22 100%);box-shadow:0 0 0 3px rgba(255,255,255,0.08);flex-shrink:0;}
  .brand-text{color:#f1ede3;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;}
  .app-version-corner{position:fixed;right:10px;bottom:56px;color:rgba(255,255,255,0.35);font-size:8px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;z-index:55;pointer-events:none;}
  @media (min-width:820px){ .app-version-corner{bottom:9px;} }
  .btn.theme-toggle{width:34px;height:34px;padding:0;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid rgba(255,255,255,0.25);color:#fff;}
  .theme-toggle svg, .lang-toggle svg{width:18px;height:18px;display:block;vertical-align:middle;}
  .theme-toggle.mode-sun{background:#c98a2e;border-color:#e0a94f;}
  .theme-toggle.mode-moon{background:#3a4f8c;border-color:#5c72ad;}
  .lang-wrap{position:relative;}
  .btn.lang-toggle{width:34px;height:34px;padding:0;font-size:15px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#4d7a63;border:1.5px solid #6e9c81;color:#fff;}
  .btn.currency-toggle{width:34px;height:34px;padding:0;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#a3773f;border:1.5px solid #c4935a;color:#fff;}
  .lang-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 14px 34px -12px rgba(0,0,0,0.5);display:none;flex-direction:column;min-width:120px;overflow:hidden;z-index:120;}
  .lang-menu.open{display:flex;}
  .lang-menu button{background:none;border:none;text-align:left;padding:9px 13px;font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;}
  .lang-menu button:hover{background:var(--card-bg);}
  .brand-text b{color:var(--sage);}
  .crumbs{font-size:11px;color:rgba(241,237,227,0.5);line-height:1.6;}
  .crumbs button{background:none;border:none;color:rgba(241,237,227,0.8);font-family:inherit;font-size:11px;cursor:pointer;text-decoration:underline;padding:5px 0;}
  .crumbs .sep{margin:0 5px;color:rgba(241,237,227,0.3);}
  .crumbs .current{color:var(--sage);}

  /* ===== Navegación ===== */
  .topnav{display:none;}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--navy);border-top:1px solid rgba(255,255,255,0.08);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);}
  .navitem{flex:1;background:none;border:none;color:rgba(241,237,227,0.55);font-family:inherit;font-size:9px;letter-spacing:0.02em;text-transform:uppercase;padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .navitem .navicon{font-size:15px;line-height:1;}
  .navitem.active{color:var(--sage);}
  @media (min-width:820px){
    .bottomnav{display:none;}
    .topnav{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:0;}
    .navitem{flex:none;flex-direction:row;font-size:11px;padding:9px 14px;border-radius:5px 5px 0 0;}
    .navitem.active{background:var(--paper);color:var(--heading);}
    body{padding-bottom:40px;}
  }

  .frame{background:var(--paper);border-radius:8px;padding:2px;box-shadow:0 40px 70px -25px rgba(0,0,0,0.65);}
  .frame-inner{border:1px solid var(--line);border-radius:7px;padding:16px 14px;position:relative;min-height:300px;}
  .kicker{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--brick);margin-bottom:7px;}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--brick);flex-shrink:0;}
  h1{font-family:'Newsreader', serif;font-weight:600;font-size:24px;color:var(--heading);margin:0 0 14px 0;line-height:1.25;}
  .h1-edit{display:block;width:100%;font-family:'Newsreader', serif;font-weight:600;font-size:24px;color:var(--heading);margin:0 0 14px 0;line-height:1.25;border:none;border-bottom:1px dashed var(--line);background:transparent;padding:0 0 4px 0;}
  .h1-edit:focus{outline:none;border-bottom-color:var(--heading);}
  h2{font-family:'Newsreader',serif;font-weight:600;font-size:17px;color:var(--heading);margin:0 0 4px 0;}
  h3{font-family:'Newsreader',serif;font-weight:600;font-size:13.5px;color:var(--heading);margin:18px 0 8px 0;padding-top:12px;border-top:1px solid var(--line);}
  h3:first-child{margin-top:0;padding-top:0;border-top:none;}
  .section-sub{font-size:12px;color:var(--ink-dim);margin-bottom:12px;line-height:1.5;}

  /* ===== Dashboard stats ===== */
  .stat-strip{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px;}
  .stat{padding:13px 13px;border-right:1px solid var(--line);background:var(--card-bg);}
  .stat:last-child{border-right:none;}
  .stat:last-child{border-right:none;}
  .stat-label{font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px;}
  .stat-value{font-family:'Newsreader',serif;font-weight:600;font-size:19px;color:var(--heading);}
  .stat-sub{font-size:10px;color:var(--ink-dim);margin-top:3px;}
  .ring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--brick) 0% var(--p,0%), rgba(28,42,66,0.12) var(--p,0%) 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 1.1s ease;}
  .ring-hole{width:29px;height:29px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:9px;color:var(--heading);}
  .ring-row{display:flex;align-items:center;gap:9px;}
  .ring-hero{width:168px;height:168px;margin:4px auto 6px;}
  .ring-hero .ring-hole{width:136px;height:136px;flex-direction:column;}
  .ring-hero-pct{font-family:'Newsreader',serif;font-weight:700;font-size:38px;color:var(--heading);line-height:1;}
  .ring-hero-sub{font-size:10.5px;color:var(--ink-dim);margin-top:5px;text-align:center;}
  .hero-wrap{text-align:center;margin-bottom:16px;}
  @media (min-width:641px){ .stat-strip{grid-template-columns:1fr 1fr;} }
  @media (max-width:640px){ .stat-strip{grid-template-columns:1fr 1fr;} }

  .bar-row{margin-bottom:11px;}
  .accordion-toggle{display:block;width:100%;text-align:left;font-family:'Newsreader',serif;font-weight:600;font-size:14.5px;color:var(--heading);background:var(--card-bg);border:1px solid var(--line);border-radius:6px;padding:11px 13px;margin:10px 0 4px;cursor:pointer;}

  /* Pantalla de Ayuda — tarjetas visuales con icono y texto de lectura
     (serif), para que se sienta como una guía y no como un panel técnico. */
  .ayuda-intro{font-family:'Newsreader',serif;font-size:14px;font-style:italic;color:var(--ink-dim);line-height:1.6;margin-bottom:18px;}
  .ayuda-card{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden;}
  .ayuda-card-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;padding:13px 14px;cursor:pointer;font-family:inherit;}
  .ayuda-icon{width:36px;height:36px;border-radius:10px;background:var(--navy);color:#f1ede3;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ayuda-title{flex:1;font-family:'Newsreader',serif;font-weight:600;font-size:14.5px;color:var(--heading);}
  .ayuda-chevron{color:var(--ink-dim);font-size:11px;flex-shrink:0;}
  .ayuda-body{padding:2px 16px 18px 62px;font-family:'Newsreader',serif;font-size:14px;line-height:1.7;color:var(--ink);}
  .ayuda-body b{color:var(--heading);}

  /* Los dos botones grandes de Exportar/Importar todo, en la pantalla de
     Copia de seguridad */
  .backup-hero{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:14px 0 6px;}
  .backup-btn{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 12px;border-radius:14px;border:1px solid var(--line);cursor:pointer;font-family:inherit;}
  .backup-btn-export{background:var(--navy);color:#f1ede3;}
  .backup-btn-import{background:var(--card-bg);color:var(--heading);}
  .backup-btn-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;}
  .backup-btn-export .backup-btn-icon{background:rgba(255,255,255,0.14);}
  .backup-btn-import .backup-btn-icon{background:var(--navy);color:#f1ede3;}
  .backup-btn-label{font-family:'Newsreader',serif;font-weight:600;font-size:14.5px;}
  .backup-btn-sub{font-size:9.5px;opacity:0.75;line-height:1.4;}

  /* Tour guiado de bienvenida */
  .tour-spotlight{position:relative !important;z-index:600 !important;box-shadow:0 0 0 6000px rgba(10,15,24,0.78), 0 0 0 3px var(--gold) !important;border-radius:10px;animation:tourPulse 1.6s ease-in-out infinite;}
  .tour-spotlight-fixed{z-index:600 !important;box-shadow:0 0 0 6000px rgba(10,15,24,0.78), 0 0 0 3px var(--gold) !important;border-radius:50% !important;animation:tourPulse 1.6s ease-in-out infinite;}
  @keyframes tourPulse{0%,100%{box-shadow:0 0 0 6000px rgba(10,15,24,0.78), 0 0 0 3px var(--gold), 0 0 0 0 rgba(184,146,90,0.55);}50%{box-shadow:0 0 0 6000px rgba(10,15,24,0.78), 0 0 0 3px var(--gold), 0 0 0 14px rgba(184,146,90,0);}}
  .tour-caption{position:fixed;left:12px;right:12px;bottom:145px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 17px 13px;z-index:601;box-shadow:0 16px 40px -14px rgba(0,0,0,0.55);}
  .tour-caption-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .tour-caption-icon{width:32px;height:32px;border-radius:9px;background:var(--navy);color:#f1ede3;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tour-dots{display:flex;gap:5px;}
  .tour-dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
  .tour-dot-done{background:var(--sage);}
  .tour-dot-current{background:var(--gold);width:16px;border-radius:3px;}
  .tour-caption-text{font-family:'Newsreader',serif;font-size:14px;line-height:1.6;color:var(--ink);margin-bottom:11px;}
  .tour-caption-text b{color:var(--heading);}
  .tour-caption-foot{display:flex;justify-content:space-between;align-items:center;}
  .tour-caption-count{font-size:10px;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-dim);}
  .tour-skip{font-size:11px;color:var(--ink-dim);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit;}
  .tour-modal-backdrop{position:fixed;inset:0;background:rgba(10,15,24,0.82);z-index:700;display:flex;align-items:center;justify-content:center;padding:24px;}
  .tour-modal{background:var(--paper);border-radius:18px;padding:30px 24px 26px;max-width:360px;text-align:center;}
  .tour-modal-icon{width:56px;height:56px;border-radius:50%;background:var(--navy);color:#f1ede3;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .tour-modal-icon svg{width:26px;height:26px;}
  .tour-modal-title{font-family:'Newsreader',serif;font-weight:700;font-size:20px;color:var(--heading);margin-bottom:11px;}
  .tour-modal-body{font-family:'Newsreader',serif;font-size:14px;line-height:1.65;color:var(--ink);margin-bottom:22px;}

  /* Cuadro de diálogo propio — sustituye a prompt()/confirm() del navegador,
     que no funcionan de forma fiable dentro de una PWA instalada. */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,15,24,0.78);z-index:800;display:none;align-items:center;justify-content:center;padding:24px;}
  .modal-overlay.open{display:flex;}
  .modal-card{background:var(--paper);border-radius:16px;padding:22px 20px;max-width:340px;width:100%;box-shadow:0 24px 60px -18px rgba(0,0,0,0.55);}
  .modal-title{font-family:'Newsreader',serif;font-weight:600;font-size:15.5px;color:var(--heading);margin-bottom:14px;line-height:1.4;}
  .modal-input{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;color:var(--ink);background:var(--field-bg);border:1px solid var(--line);border-radius:7px;padding:11px 12px;margin-bottom:16px;}
  .modal-actions{display:flex;gap:9px;justify-content:flex-end;}
  .modal-actions .btn{margin:0;}

  /* Botón grande de "crear" — usado para categoría nueva y similares, en
     vez del botón de texto plano que quedaba pobre a la vista. */
  .create-btn{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card-bg);border:1.5px dashed var(--navy);border-radius:12px;padding:15px 16px;margin-top:12px;cursor:pointer;font-family:inherit;}
  .create-btn-icon{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#f1ede3;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;font-weight:600;}
  .create-btn-label{font-family:'Newsreader',serif;font-weight:600;font-size:14.5px;color:var(--heading);}
  .create-btn-sub{font-size:10px;color:var(--ink-dim);margin-top:2px;}
  .accordion-body{padding:10px 2px 2px;}
  .bar-labels{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}
  .bar-labels .name{color:var(--heading);font-weight:600;}
  .bar-labels .pct{color:var(--ink-dim);}
  .bar-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--sage);border-radius:3px;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1);}
  .bar-fill.brick{background:var(--brick);}

  .quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .btn{font-family:inherit;font-size:10.5px;background:none;border:1px solid var(--line);color:var(--heading);padding:8px 12px;border-radius:5px;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn:active{background:rgba(28,42,66,0.06);}
  .btn.primary{background:var(--navy);color:#f1ede3;border-color:var(--heading);}


  /* barras de progreso finas — categorías (Dashboard/Colección) */
  .prow{background:var(--card-bg);border-radius:6px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
  .prow:active{background:var(--card-bg-active);}
  .prow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px;}
  .prow-name{font-family:'Newsreader',serif;font-weight:600;font-size:14.5px;color:var(--heading);}
  .prow-desc{font-size:10.5px;color:var(--ink-dim);margin-top:2px;line-height:1.4;}
  .prow-pct{font-size:10.5px;color:var(--heading);font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .microbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
  .microbar-fill{height:100%;background:var(--sage);border-radius:2px;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1);}
  .microbar-fill.brick{background:var(--brick);}

  /* plataformas dentro de una categoría — tarjeta grande, insignia con código */
  .plat-card{display:flex;align-items:center;gap:13px;background:var(--card-bg);border-radius:8px;padding:12px 14px;margin-bottom:9px;cursor:pointer;min-height:64px;}
  .plat-card:active{background:var(--card-bg-active);}
  .plat-badge{width:46px;height:46px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11.5px;letter-spacing:0.02em;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18);}
  .plat-badge.navy{background:var(--navy);}
  .plat-badge.sage{background:var(--sage);}
  .plat-badge.brick{background:var(--brick);}
  .plat-badge.gold{background:var(--gold);}
  .plat-card-body{flex:1;min-width:0;}
  .plat-name-lg{font-family:'Newsreader',serif;font-weight:600;font-size:17px;color:var(--heading);line-height:1.25;margin-bottom:6px;}
  .plat-card-bottom{display:flex;align-items:center;gap:8px;}
  .plat-card-bottom .microbar{flex:1;min-width:0;}
  .plat-move{display:flex;flex-direction:column;gap:2px;flex-shrink:0;margin-left:4px;}
  .plat-move button{width:26px;height:24px;font-size:10px;background:var(--card-bg);border:1px solid var(--line);border-radius:4px;color:var(--heading);cursor:pointer;}
  .plat-move button:disabled{opacity:0.25;cursor:default;}

  /* búsqueda local del Dashboard */
  #dash-search-results{margin-bottom:14px;}
  .search-hit{background:var(--card-bg);border-radius:6px;padding:10px 13px;margin-bottom:6px;cursor:pointer;}
  .search-hit:active{background:var(--card-bg-active);}
  .search-hit-name{font-family:'Newsreader',serif;font-weight:600;font-size:14px;color:var(--heading);}
  .search-hit-meta{font-size:10px;color:var(--ink-dim);margin-top:2px;}

  .fab{position:fixed;right:18px;bottom:74px;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:26px;line-height:1;font-family:'IBM Plex Mono',monospace;box-shadow:0 10px 24px -6px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.15);cursor:pointer;z-index:60;align-items:center;justify-content:center;}
  .fab:active{background:var(--navy-deep);}
  .fab-left{right:auto;left:18px;background:var(--card-bg-active);color:var(--heading);font-size:24px;}
  .fab-left:active{background:#fff;}

  .pinch-overlay{position:fixed;inset:0;background:rgba(19,29,48,0.94);z-index:200;display:none;align-items:center;justify-content:center;touch-action:none;}
  .pinch-overlay img{max-width:92vw;max-height:92vh;transform-origin:center center;will-change:transform;border-radius:4px;}

  .badge-region{background:rgba(124,148,115,0.18);color:var(--sage);}
  .chip-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .chip{flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--card-bg);border:1px solid var(--line);color:var(--heading);padding:7px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--heading);}
  .plat-pct-lg{font-size:11px;color:var(--ink-dim);font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;width:32px;text-align:right;}

  .empty-state{border:1px dashed var(--line);border-radius:6px;padding:22px 18px;text-align:center;}
  .empty-state p{font-size:12px;color:var(--ink-dim);margin:0 0 5px 0;line-height:1.6;}

<script>
/* =========================================================================
   ARCHIVO · SERGIO — v2
   Arquitectura: PRODUCTO (el juego/objeto en sí) → EDICIÓN (región/idioma/
   versión concreta) → UNIDAD (la pieza física que posee Sergio: posesión,
   checklist de componentes, conservación, procedencia, valoración, fotos).
   Los datos ya investigados (categorías, plataformas, títulos, variantes)
   se conservan tal cual como "semilla" de solo lectura; encima se aplican
   los "overrides" (tus ediciones), guardados en IndexedDB del navegador.
   ========================================================================= */

/* ---------- 1. DATOS SEMILLA (todo lo investigado hasta ahora) ---------- */

const SEED_CATEGORIES = [];

const SEED_PLATFORMS = [];

// Productos "sueltos" de Juguetes electrónicos (sin plataforma intermedia)
const SEED_JUGUETES = [];

// title: {id, name, year, jp, standalone, dlc}
const SEED_PRODUCTS = {};

// ediciones por producto: {name, region, year, tags, src, have}
const SEED_EDITIONS = {};

function seedDefaultEdition(prod){
  return [{ name:"Edición estándar", region: prod.jp ? "Japón" : "", year:prod.year, tags:[], src:"pendiente de tu volcado", have:false }];
}

/* ---------- 2. ALMACENAMIENTO: IndexedDB (fotos + overrides del usuario) ---------- */
/* No depende del chat de Claude: funciona en cualquier navegador si abres
   este archivo directamente (recomendado: Safari/Chrome, no la vista
   previa incrustada del chat, para que el selector de galería no esté
   restringido). */

const DB_NAME = 'archivo_sergio_db';
const PHOTOS_STORE = 'fotos';
const KV_STORE = 'kv';

function openDB(){
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('Este navegador no soporta almacenamiento local')); return; }
    const req = indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = (e)=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(PHOTOS_STORE)) db.createObjectStore(PHOTOS_STORE);
      if(!db.objectStoreNames.contains(KV_STORE)) db.createObjectStore(KV_STORE);
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function idbGet(store, key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const r = tx.objectStore(store).get(key);
    r.onsuccess = ()=>resolve(r.result || null);
    r.onerror = ()=>reject(r.error);
  })).catch(()=>null);
}
function idbSet(store, key, val){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(val, key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  })).catch(()=>false);
}
function idbDelete(store, key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  })).catch(()=>false);
}
function idbGetAll(store){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const os = tx.objectStore(store);
    const keysReq = os.getAllKeys();
    const valsReq = os.getAll();
    let keys, vals;
    keysReq.onsuccess = ()=>{ keys = keysReq.result; if(vals!==undefined) resolve({keys, vals}); };
    valsReq.onsuccess = ()=>{ vals = valsReq.result; if(keys!==undefined) resolve({keys, vals}); };
    tx.onerror = ()=>reject(tx.error);
  })).catch(()=>({keys:[], vals:[]}));
}

// overrides en memoria: { products:{id:{...}}, editions:{id:{...}} }
let OVERRIDES = { products:{}, editions:{} };
let overridesLoaded = false;
async function ensureOverridesLoaded(){
  if(overridesLoaded) return;
  const saved = await idbGet(KV_STORE, 'overrides');
  if(saved){
    try{ OVERRIDES = JSON.parse(saved); }catch(e){}
  } else {
    // Primera vez que se abre esta copia del archivo en este navegador:
    // arranca completamente en blanco, como si fueras un coleccionista
    // nuevo — sin el catálogo de ejemplo cargado. Importa una copia de
    // seguridad (o crea tus propias categorías) para empezar a llenarla.
    OVERRIDES.seedEnabled = false;
  }
  overridesLoaded = true;
}
async function persistOverrides(){
  await idbSet(KV_STORE, 'overrides', JSON.stringify(OVERRIDES));
}
function getProductOverride(id){ return OVERRIDES.products[id] || {}; }
function getEditionOverride(id){ return OVERRIDES.editions[id] || {}; }
async function setProductField(id, field, value){
  if(!OVERRIDES.products[id]) OVERRIDES.products[id] = {};
  OVERRIDES.products[id][field] = value;
  await persistOverrides();
}
/* A partir de este aplanado, "producto" y "edición" son la misma entidad:
   todo lo que antes era un campo de "edición" (checklist, posesión,
   conservación, procedencia, valoración, objetivo) se guarda ahora en el
   mismo cajón que el resto de campos del ítem (OVERRIDES.products), para
   que nunca se pierda al recargar. OVERRIDES.editions se conserva solo
   para poder leer datos de versiones anteriores de la app. */
async function setEditionField(id, field, value){
  if(!OVERRIDES.products[id]) OVERRIDES.products[id] = {};
  OVERRIDES.products[id][field] = value;
  await persistOverrides();
}
async function setEditionNested(id, group, field, value){
  if(!OVERRIDES.products[id]) OVERRIDES.products[id] = {};
  if(!OVERRIDES.products[id][group]) OVERRIDES.products[id][group] = {};
  OVERRIDES.products[id][group][field] = value;
  await persistOverrides();
}

// Fotos: recorte a cuadrado 1200x1200 sobre fondo blanco
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 1200;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,size,size);
        const scale = Math.min(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}
async function loadPhoto(key){ return idbGet(PHOTOS_STORE, key); }
async function savePhotoFile(key, file){
  try{
    const dataUrl = await compressImage(file);
    const ok = await idbSet(PHOTOS_STORE, key, dataUrl);
    if(!ok){ alert('No se pudo guardar la foto en este navegador. Ábrelo directamente en Safari/Chrome, no en la vista previa del chat.'); return null; }
    return dataUrl;
  }catch(err){ alert('No se pudo guardar la foto: ' + err.message); return null; }
}
async function removePhoto(key){ await idbDelete(PHOTOS_STORE, key); }

/* ---------- 3. CONSTRUCCIÓN DEL MODELO: PRODUCTOS con EDICIONES ---------- */

const DEFAULT_REQUIRED = ['tengo'];
/* La lista de componentes del checklist por defecto — a partir de ahora,
   de fábrica, solo trae "Lo tengo" (además de "Está sellado", que es fijo
   y aparte). Marcar cualquiera de las dos pone la posesión en "tengo";
   destildar las dos la vuelve a poner en "no tengo". Cada categoría puede
   ampliarla con más componentes si quiere un checklist más detallado. */
const DEFAULT_CHECKLIST_ITEMS = [
  { key:'tengo', label:'Lo tengo' },
];
function checklistForCategory(catId){
  return (OVERRIDES.categoryChecklist && OVERRIDES.categoryChecklist[catId]) || DEFAULT_CHECKLIST_ITEMS;
}
async function addChecklistItem(catId){
  const label = await showPromptModal(t('dlg.new_component'));
  if(!label) return;
  const current = checklistForCategory(catId).slice();
  const key = 'c' + Math.random().toString(36).slice(2,8);
  current.push({ key, label });
  if(!OVERRIDES.categoryChecklist) OVERRIDES.categoryChecklist = {};
  OVERRIDES.categoryChecklist[catId] = current;
  await persistOverrides();
  buildProducts();
  render();
}
async function renameChecklistItemPrompt(catId, idx){
  const items = checklistForCategory(catId);
  const item = items[idx]; if(!item) return;
  const newLabel = await showPromptModal(t('dlg.rename_component'), item.label);
  if(!newLabel) return;
  const current = items.slice();
  current[idx] = Object.assign({}, current[idx], { label: newLabel.trim() });
  if(!OVERRIDES.categoryChecklist) OVERRIDES.categoryChecklist = {};
  OVERRIDES.categoryChecklist[catId] = current;
  await persistOverrides();
  render();
}
async function removeChecklistItem(catId, idx){
  const current = checklistForCategory(catId).slice();
  if(current.length<=1){ alert('Tiene que quedar al menos un componente en la lista.'); return; }
  current.splice(idx,1);
  if(!OVERRIDES.categoryChecklist) OVERRIDES.categoryChecklist = {};
  OVERRIDES.categoryChecklist[catId] = current;
  await persistOverrides();
  buildProducts();
  render();
}
async function resetChecklist(catId){
  if(!await showConfirmModal(t('dlg.reset_checklist_confirm'))) return;
  if(OVERRIDES.categoryChecklist) delete OVERRIDES.categoryChecklist[catId];
  await persistOverrides();
  buildProducts();
  render();
}
function checklistEditorHTML(catId){
  const items = checklistForCategory(catId);
  const isCustom = !!(OVERRIDES.categoryChecklist && OVERRIDES.categoryChecklist[catId]);
  let html = `<div class="section-sub">${t('checklist.intro')}</div>`;
  items.forEach((item, idx)=>{

const SEED_RESEARCH = {};

function requiredComponentsFor(prod){
  if(prod.dlc) return ['juego'];
  if(prod.jp && prod.categoryId==='media') return ['juego'];
  const custom = OVERRIDES.categoryChecklist && OVERRIDES.categoryChecklist[prod.categoryId];
  if(custom) return custom.map(item=>item.key);
  return DEFAULT_REQUIRED;
}

let PRODUCTS = []; // se rellena en buildProducts()
let PRODUCTS_BY_ID = {};
let EDITIONS_BY_ID = {};

function buildProducts(){
  PRODUCTS = [];
  const seqByCode = {};

  function pushProduct(base){
    const catId = base.categoryId;
    const requiredComponents = base.requiredComponents || requiredComponentsFor(base);
    const rawEditions = (base.editions && base.editions.length) ? base.editions : seedDefaultEdition(base);
    const multi = rawEditions.length > 1;
    const code = base.platformCode || 'X';
    const sharedOverride = getProductOverride(base.id);
    if(sharedOverride.deleted) return; // borrar el juego entero borra también sus variantes
    const research = SEED_RESEARCH[base.id] || {};

    rawEditions.forEach((e, idx)=>{
      const flatId = multi ? (base.id + '__e' + idx) : base.id;
      const legacyEditionId = base.id + '__e' + idx;
      if(getProductOverride(flatId).deleted) return; // borrar solo esta variante concreta

      seqByCode[code] = (seqByCode[code]||0) + 1;
      const displayId = 'PKM-' + code + '-' + String(seqByCode[code]).padStart(3,'0');
      const seedExistence = e.existence || base.existence || (base.flagged ? 'sin_confirmar' : 'confirmado');
      const name = multi ? (base.name + ' — ' + e.name) : base.name;

      const catChecklist = checklistForCategory(catId);
      const componentsDefault = {};
      catChecklist.forEach(item=>{ componentsDefault[item.key] = false; });
      if(e.have && catChecklist===DEFAULT_CHECKLIST_ITEMS){
        componentsDefault.tengo = true;
      }
      const defaults = {
        id: flatId, displayId, name, nameJp:'', categoryId: catId,
        platformId: base.platformId || null, platformName: base.platformName || '',
        year: e.year || base.year,
        genre:'', developer:'', publisher:'', manufacturer: base.maker || '',
        existence: seedExistence,
        standalone: !!base.standalone, dlc: !!base.dlc, jp: !!base.jp, special: !!base.special,
        regionTags: base.jp ? ['jp'] : [],
        summary: research.summary || '', notes:'', research: base.research || null,
        rareza: research.rareza || '',
        requiredComponents,
        region: e.region, language:null,
        tags: e.tags || [], src: e.src,
        catalogNumber:'', productCode:'', barcode:'', releaseDateExact: research.releaseDateExact || '',
        possession: e.have ? 'tengo' : 'no',
        components: componentsDefault,
        sealed:false,
        conservation: { caja:null, manual:null, cartucho:null, general:null, notas:'' },
        valuation: { valorAdquisicion:null, valorActual:null, fechaActualizacion:'', fuente:'', notas:'' },
        customFields: [], folderId: base.folderId || null,
      };
      const legacyEditionOverride = getEditionOverride(legacyEditionId);
      const ownOverride = getProductOverride(flatId);
      const item = Object.assign({}, defaults, legacyEditionOverride, sharedOverride, ownOverride);
      delete item.deleted;
      PRODUCTS.push(item);
    });
  }

  // videojuegos + media: productos agrupados por plataforma (el catálogo de
  // ejemplo no se carga en una copia recién estrenada — solo cuando ya
  // tienes datos propios, o los has importado desde una copia de seguridad)
  if(OVERRIDES.seedEnabled !== false){
    SEED_PLATFORMS.forEach(plat=>{
      const list = SEED_PRODUCTS[plat.id] || [];
      list.forEach(t=>{
        pushProduct(Object.assign({}, t, {
          categoryId: plat.categoryId, platformId: plat.id, platformName: plat.name,
          platformCode: plat.code, maker: plat.maker,
          editions: SEED_EDITIONS[t.id],
        }));
      });
    });

    // juguetes: productos sueltos
    SEED_JUGUETES.forEach(j=>{
      pushProduct(Object.assign({}, j, { platformCode:'TOY', editions: SEED_EDITIONS[j.id] }));
    });
  }

  // productos añadidos manualmente por Sergio (juegos, CD-ROMs, DVDs, lo que sea)
  (OVERRIDES.customProducts || []).forEach(cp=> pushProduct(cp));

  // el nombre de la plataforma de cada producto se resuelve SIEMPRE en vivo
  // aquí al final, para que un renombre posterior (renamePlatform) se vea
  // reflejado en todas partes sin quedarse con el nombre antiguo guardado.
  const platformsById = {};
  getAllPlatforms().forEach(pl=> platformsById[pl.id] = pl);
  PRODUCTS.forEach(item=>{
    if(item.platformId && platformsById[item.platformId]){
      item.platformName = platformsById[item.platformId].name;
    }
  });

  PRODUCTS_BY_ID = {};
  PRODUCTS.forEach(p=> PRODUCTS_BY_ID[p.id] = p);
  EDITIONS_BY_ID = {};
  PRODUCTS.forEach(p=> EDITIONS_BY_ID[p.id] = { product:p, edition:p });
}

function allEditions(){
  return PRODUCTS.map(p=> ({ product:p, edition:p }));
}
/* Igual que allEditions(), pero sin las piezas de plataformas marcadas como
   "no cuenta para la colección" (solo inventario/logística) — se usa para
   los totales globales y por categoría, nunca para las páginas propias de
   cada plataforma ni para Inventario/búsqueda, que siguen mostrándolo todo. */
function allEditionsForStats(){
  return PRODUCTS.filter(p => platformCountsInCollection(p.platformId)).map(p=> ({ product:p, edition:p }));
}
function platformCountsInCollection(platId){
  if(!platId) return true;
  return !(OVERRIDES.platformFlags && OVERRIDES.platformFlags[platId] && OVERRIDES.platformFlags[platId].countsInCollection === false);
}
async function togglePlatformCounts(platId){
  if(!OVERRIDES.platformFlags) OVERRIDES.platformFlags = {};
  if(!OVERRIDES.platformFlags[platId]) OVERRIDES.platformFlags[platId] = {};
  OVERRIDES.platformFlags[platId].countsInCollection = !platformCountsInCollection(platId);
  await persistOverrides();
  render();
}

/* año de salida primero, alfabético después — se aplica en toda la app */
function sortGames(list){
  return list.slice().sort((a,b)=>{
    const ya = parseInt(a.year, 10); const yb = parseInt(b.year, 10);
    const na = isNaN(ya) ? 9999 : ya;
    const nb = isNaN(yb) ? 9999 : yb;
    if(na !== nb) return na - nb;
    return (a.name||'').localeCompare(b.name||'', 'es', {sensitivity:'base'});
  });
}

/* plataformas/consolas propias de Sergio, sumadas a las de serie, con
   posibles renombres aplicados encima */
function getAllPlatforms(){
  const seedPart = OVERRIDES.seedEnabled === false ? [] : SEED_PLATFORMS;
  const all = seedPart.concat(OVERRIDES.customPlatforms || []);
  return all
    .filter(p => !(OVERRIDES.platformFlags && OVERRIDES.platformFlags[p.id] && OVERRIDES.platformFlags[p.id].deleted))
    .map(p => (OVERRIDES.platformNames && OVERRIDES.platformNames[p.id]) ? Object.assign({}, p, {name: OVERRIDES.platformNames[p.id]}) : p);
}
/* Orden de plataformas dentro de una categoría: las que tienen año se
   ordenan siempre de más antigua a más nueva; las que no tienen año
   (ej. "PC", "CD-ROM") se quedan fijas en la posición que el usuario les
   haya dado a mano con las flechas ▲▼, sin desordenar a las demás. */
function platformHasYear(p){
  return !isNaN(parseInt(p.year, 10));
}
function orderedPlatformsForCategory(catId, plats){
  const savedOrder = (OVERRIDES.categoryOrder && OVERRIDES.categoryOrder[catId]) || null;
  let base = plats.slice();
  if(savedOrder){
    const byId = {}; base.forEach(p=> byId[p.id]=p);
    let ordered = savedOrder.map(id=> byId[id]).filter(Boolean);
    const seen = new Set(ordered.map(p=>p.id));
    base.forEach(p=>{ if(!seen.has(p.id)) ordered.push(p); });
    base = ordered;
  }
  const datedSorted = base.filter(platformHasYear).slice().sort((a,b)=> parseInt(a.year,10)-parseInt(b.year,10));
  let di = 0;
  return base.map(p=> platformHasYear(p) ? datedSorted[di++] : p);
}
async function movePlatform(catId, platId, dir){
  const plats = orderedPlatformsForCategory(catId, getAllPlatforms().filter(p=>p.categoryId===catId));
  const idx = plats.findIndex(p=>p.id===platId);
  const newIdx = idx + dir;
  if(idx<0 || newIdx<0 || newIdx>=plats.length) return;
  const arr = plats.map(p=>p.id);
  const tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  if(!OVERRIDES.categoryOrder) OVERRIDES.categoryOrder = {};
  OVERRIDES.categoryOrder[catId] = arr;
  await persistOverrides();
  render();
}
async function deletePlatform(catId, platId){
  const plat = getAllPlatforms().find(p=>p.id===platId);
  if(!plat) return;
  const prods = PRODUCTS.filter(p=>p.platformId===platId);
  if(!await showConfirmModal(t('dlg.delete_platform_confirm').replace('{name}', plat.name).replace('{n}', prods.length))) return;
  for(const p of prods){ await setProductField(p.id, 'deleted', true); }
  if(!OVERRIDES.platformFlags) OVERRIDES.platformFlags = {};
  if(!OVERRIDES.platformFlags[platId]) OVERRIDES.platformFlags[platId] = {};
  OVERRIDES.platformFlags[platId].deleted = true;
  await persistOverrides();
  buildProducts();
  goCategory(catId);
}

/* Carpetas — un nivel extra dentro de una plataforma, para cuando se llena
   de cosas muy distintas entre sí. Se usan mucho menos que añadir un
   producto, así que su botón de creación vive abajo del todo, discreto. */
function foldersForPlatform(platId){

}
async function addFolder(catId, platId){

async function renameFolder(platId, folderId, newName){

async function deleteFolder(catId, platId, folderId){
  const prods = PRODUCTS.filter(p=>p.platformId===platId && p.folderId===folderId);
  if(!await showConfirmModal(`${t('dlg.delete_folder_q')} ${prods.length ? t('dlg.delete_folder_has').replace('{n}', prods.length) : t('dlg.delete_folder_empty')}`)) return;

/* categorías: las de serie + las que crees tú, con posibles renombres

function getAllCategories(){

/* La descripción de cada categoría ya no es un texto fijo — se genera sola
   a partir de las plataformas/subcampos que de verdad tiene dentro, para
   que valga igual para cualquier tipo de colección, no solo Pokémon. */
function categoryAutoDesc(catId){
  const plats = getAllPlatforms().filter(p=>p.categoryId===catId);
  if(!plats.length) return 'Todavía sin plataformas/secciones dentro.';
  const names = plats.map(p=>p.name);
  if(names.length<=3) return names.join(', ');
  return names.slice(0,3).join(', ') + ' y ' + (names.length-3) + ' más';
}
async function renameCategory(catId, newName){

  await persistOverrides();

}

  OVERRIDES.platformNames[platId] = newName;

function isComplete(product, edition){
  if(edition.possession !== 'tengo') return null;
  return product.requiredComponents.every(c => !!edition.components[c]);
}

/* ---------- 4. ESTADÍSTICAS CALCULADAS (nunca hardcodeadas) ---------- */

function computeGlobalStats(){
  const eds = allEditionsForStats();
  const total = eds.length;
  const have = eds.filter(x=>x.edition.possession==='tengo').length;
  const pending = total - have;
  const pct = total ? Math.round((have/total)*100) : 0;
  let valor = 0;
  eds.forEach(x=>{
    if(x.edition.possession==='tengo' && x.edition.valuation && typeof x.edition.valuation.valorActual === 'number'){
      valor += x.edition.valuation.valorActual;
    }
  });
  let lastUpdate = null;
  eds.forEach(x=>{
    const f = x.edition.valuation && x.edition.valuation.fechaActualizacion;
    if(f && (!lastUpdate || f > lastUpdate)) lastUpdate = f;
  });
  return { total, have, pending, pct, valor, lastUpdate };
}
function computeStatsFor(editionsSubset){
  const total = editionsSubset.length;
  const have = editionsSubset.filter(x=>x.edition.possession==='tengo').length;
  return { total, have, pct: total? Math.round((have/total)*100):0 };
}
function statsByCategory(){
  const eds = allEditionsForStats();
  return getAllCategories().map(c=>{
    const subset = eds.filter(x=>x.product.categoryId===c.id);
    return Object.assign({ id:c.id, name:c.name }, computeStatsFor(subset));
  });
}
function statsByPlatform(){
  const eds = allEditions();
  return getAllPlatforms().map(p=>{
    const subset = eds.filter(x=>x.product.platformId===p.id);
    return Object.assign({ id:p.id, name:p.name }, computeStatsFor(subset));
  }).filter(s=>s.total>0);
}
function statsByRegion(){
  const eds = allEditions();
  const map = {};
  eds.forEach(x=>{
    const r = (x.edition.region||'Sin especificar').split(' — ')[0].split(' (')[0];
    const key = r.includes('Japón')?'Japón': r.includes('España')?'España': r.includes('Europa')?'Europa': r.includes('EE.UU')?'EE.UU.': (r||'Otras');
    if(!map[key]) map[key] = {total:0, have:0};
    map[key].total++;
    if(x.edition.possession==='tengo') map[key].have++;
  });
  return Object.keys(map).map(k=>({ name:k, total:map[k].total, have:map[k].have, pct: Math.round((map[k].have/map[k].total)*100) }));
}

    'ayuda.organize.body':'Your collection is organized in three levels, from most general to most specific.<br><br><b>Category</b> — the top level (for example, "Video games" or "Comics"). Created, renamed and deleted from the "Categories" screen, inside Collection.<br><br><b>Platform</b> — a subgroup within a category (for example, "Game Boy" within "Video games"). Go into a category and use the floating "+" button to create a new one.<br><br><b>Folder</b> — a subgroup within a platform, for when it fills up with very different things. Go into a platform and look for the create-folder button at the bottom of the page.',
    'ayuda.add.body':'Inside any platform or folder, use the round "+" button that follows you around the screen, bottom right. It adapts to where you are — if you\'re inside a folder, the object is created right there.',
    'ayuda.move.body':'Go into the object\'s page and expand "Move to another platform/category". You can change its category, platform and folder all at once, without losing anything you had saved: photos, checklist, notes, everything stays intact.',
    'ayuda.rename.body':'Categories, platforms, folders and each object\'s name are normal text fields — tap them right where you see them written large and edit them right there, no special button needed.',
    'ayuda.complete.body':'The big "I have it" button on each page toggles between have/don\'t have with a single tap. Inside the checklist, "Mark everything as complete" saves you from checking each component one by one.',
    'ayuda.photos.body':'Tap or swipe any photo to see its back. With two fingers, pinch it to zoom in right at the point you touch — release and it goes back to normal size on its own. To actually upload or change a photo, go into the "Edit photos" tab of the item page.',
    'ayuda.order.body':'Inside each platform or folder you can choose the order: by year, alphabetically, or by whether you have it. Platforms without a year are moved by hand with the arrows, while the ones with a year sort themselves.',
    'ayuda.exclude.body':'Inside any platform there\'s a switch so its pieces don\'t count toward the overall percentages — useful for things you want to inventory but don\'t consider part of "the collection" itself.',
    'ayuda.backup.body':'From the Dashboard, go into "Backup and data" to export both your data and your photos — they go separately. Always save it before opening a new version of the file.',
    'ayuda.language.body':'Top right, next to the light/dark theme switch, there\'s a globe icon — tap it to switch between Spanish, English, German and Japanese. It only changes the app\'s own text; whatever you type yourself (names, notes) stays exactly as you wrote it.',
    'tour.welcome.title':'Welcome to your collection!',
    'tour.welcome.body':'This app adapts to any kind of collection — video games, comics, coins, whatever it is. Everything is organized in four levels: category, platform, folder and object. Let\'s create one of each, so you see how they fit together — it only takes a minute.',
    'tour.welcome.cta':'Start tour',
    'tour.skip':'Skip tour',
    'tour.step':'Step',
    'tour.of':'of',
    'tour.category.body':'<b>Categories</b> are the top level of your collection — for example "Video games" or "Comics". Tap here to create the first one.',
    'tour.platform.body':'Inside each category you create <b>platforms</b> or sections — for example "Game Boy" inside "Video games". Tap the "+" to add the first one.',
    'tour.folder.body':'If a platform fills up with very different things, you can create <b>folders</b> inside it to organize it better — it\'s optional, but try it once. Tap here to create the first one.',
    'tour.object.body':'And inside goes your first real <b>object</b> — the game, the comic, the coin, whatever you\'re cataloguing. Tap the "+" again to create it.',
    'tour.final.title':'You know the essentials now!',
    'tour.final.body':'That\'s how your whole collection is organized: category → platform → folder (optional) → object. You can move, rename or delete them whenever you want — and in "Help" you\'ll find the rest of the tricks (photos, custom checklist, languages…).',
    'tour.final.cta':'Start using it',
  },

    'backup.shortcut_collection':'Sammlung ansehen', 'backup.shortcut_inventory':'Vollständiges Inventar', 'backup.shortcut_research':'Unbestätigte Objekte',
    'ayuda.organize.body':'Deine Sammlung ist in drei Ebenen organisiert, vom Allgemeinsten zum Konkretesten.<br><br><b>Kategorie</b> — die oberste Ebene (z. B. "Videospiele" oder "Comics"). Wird im Bildschirm "Kategorien" innerhalb von Sammlung erstellt, umbenannt und gelöscht.<br><br><b>Plattform</b> — eine Untergruppe innerhalb einer Kategorie (z. B. "Game Boy" innerhalb von "Videospiele"). Gehe in eine Kategorie und nutze die schwebende "+"-Taste, um eine neue zu erstellen.<br><br><b>Ordner</b> — eine Untergruppe innerhalb einer Plattform, falls sie sich mit sehr unterschiedlichen Dingen füllt. Gehe in eine Plattform und suche die Schaltfläche zum Erstellen eines Ordners unten auf der Seite.',
    'ayuda.add.body':'Nutze innerhalb jeder Plattform oder jedes Ordners die runde "+"-Taste, die dir unten rechts auf dem Bildschirm folgt. Sie passt sich automatisch an, wo du dich befindest — bist du in einem Ordner, wird das Objekt direkt dort erstellt.',
    'ayuda.move.body':'Öffne die Objektseite und klappe "Zu anderer Plattform/Kategorie verschieben" auf. Du kannst Kategorie, Plattform und Ordner gleichzeitig ändern, ohne etwas zu verlieren, was du bereits gespeichert hast: Fotos, Checkliste, Notizen — alles bleibt erhalten.',
    'ayuda.rename.body':'Kategorien, Plattformen, Ordner und der Name jedes Objekts sind normale Textfelder — tippe sie genau dort an, wo du sie groß geschrieben siehst, und bearbeite sie direkt dort, ohne besondere Schaltfläche.',
    'ayuda.complete.body':'Die große Taste "Habe ich" auf jeder Seite wechselt mit einem Tippen zwischen habe/habe nicht. In der Checkliste erspart dir "Alles als vollständig markieren" das einzelne Abhaken jeder Komponente.',
    'ayuda.photos.body':'Tippe oder wische über ein Foto, um seine Rückseite zu sehen. Mit zwei Fingern kannst du es genau an der berührten Stelle vergrößern — beim Loslassen kehrt es von selbst zur normalen Größe zurück. Um ein Foto wirklich hochzuladen oder zu ändern, gehe in den Reiter "Fotos bearbeiten" der Objektseite.',
    'ayuda.order.body':'Innerhalb jeder Plattform oder jedes Ordners kannst du die Reihenfolge wählen: nach Jahr, alphabetisch, oder danach, ob du es besitzt. Plattformen ohne Jahr werden von Hand mit den Pfeilen verschoben, während sich die mit Jahr von selbst sortieren.',
    'ayuda.exclude.body':'Innerhalb jeder Plattform gibt es einen Schalter, damit ihre Stücke nicht in die Gesamtprozente einfließen — nützlich für Dinge, die du inventarisieren möchtest, aber nicht als Teil "der Sammlung" selbst betrachtest.',
    'ayuda.backup.body':'Gehe vom Dashboard aus zu "Sicherung und Daten", um sowohl deine Daten als auch deine Fotos zu exportieren — sie werden getrennt gespeichert. Speichere immer, bevor du eine neue Version der Datei öffnest.',
    'ayuda.language.body':'Oben rechts, neben dem Umschalter für hellen/dunklen Modus, findest du ein Globus-Symbol — tippe darauf, um zwischen Spanisch, Englisch, Deutsch und Japanisch zu wechseln. Es ändert nur den eigenen Text der App; was du selbst eingibst (Namen, Notizen), bleibt genau so, wie du es geschrieben hast.',
    'tour.welcome.title':'Willkommen bei deiner Sammlung!',
    'tour.welcome.body':'Diese App passt sich jeder Art von Sammlung an — Videospiele, Comics, Münzen, was auch immer. Alles ist in vier Ebenen organisiert: Kategorie, Plattform, Ordner und Objekt. Lass uns von jedem eins erstellen, damit du siehst, wie sie zusammenpassen — dauert nur eine Minute.',
    'tour.welcome.cta':'Tour starten',
    'tour.skip':'Tour überspringen',
    'tour.step':'Schritt',
    'tour.of':'von',
    'tour.category.body':'<b>Kategorien</b> sind die oberste Ebene deiner Sammlung — zum Beispiel "Videospiele" oder "Comics". Tippe hier, um die erste zu erstellen.',
    'tour.platform.body':'Innerhalb jeder Kategorie erstellst du <b>Plattformen</b> oder Abschnitte — zum Beispiel "Game Boy" innerhalb von "Videospiele". Tippe auf "+", um die erste hinzuzufügen.',
    'tour.folder.body':'Wenn sich eine Plattform mit sehr unterschiedlichen Dingen füllt, kannst du darin <b>Ordner</b> erstellen, um sie besser zu organisieren — optional, aber probier es einmal aus. Tippe hier, um den ersten zu erstellen.',
    'tour.object.body':'Und darin kommt dein erstes echtes <b>Objekt</b> — das Spiel, der Comic, die Münze, was auch immer du katalogisierst. Tippe erneut auf "+", um es zu erstellen.',
    'tour.final.title':'Jetzt kennst du das Wichtigste!',
    'tour.final.body':'So ist deine ganze Sammlung organisiert: Kategorie → Plattform → Ordner (optional) → Objekt. Du kannst sie jederzeit verschieben, umbenennen oder löschen — und unter "Hilfe" findest du den Rest der Tricks (Fotos, individuelle Checkliste, Sprachen…).',
    'tour.final.cta':'Jetzt loslegen',
  },

}

const NAV = [
  { id:'dashboard', labelKey:'nav.dashboard', icon:'◆' },
  { id:'coleccion', labelKey:'nav.coleccion', icon:'▤' },
  { id:'inventario', labelKey:'nav.inventario', icon:'☰' },
  { id:'estadisticas', labelKey:'nav.estadisticas', icon:'▲' },
  { id:'investigacion', labelKey:'nav.investigacion', icon:'?' },
  { id:'ayuda', labelKey:'nav.ayuda', icon: icon('help') },
];

let view = { page:'dashboard' };
let invState = { search:'', filter:'todos', sort:'anio', limit:60 };
let galleryLimit = 60;
async function renderGallery(){
  const withPhotoFlags = await Promise.all(PRODUCTS.map(async p=>({ p, front: await loadMainFront(p.id) })));
  const withPhoto = withPhotoFlags.filter(x=>x.front);
  const shown = withPhoto.slice(0, galleryLimit);
  let html = `<div class="kicker"><span class="dot"></span> ${t('gallery.kicker')}</div><h1>${t('gallery.title')}</h1>`;
  if(withPhoto.length===0){
    html += `<div class="empty-state"><p>${t('gallery.empty')}</p></div>`;
    return html;
  }
  html += `<div class="section-sub">${withPhoto.length} ${t('inv.results')}</div>`;
  html += `<div class="gallery-grid">`;
  shown.forEach(x=>{
    html += `<div class="gallery-cell" onclick="goProduct('${x.p.id}')"><img src="${x.front}" alt="${x.p.name}" loading="lazy"></div>`;
  });
  html += `</div>`;
  if(withPhoto.length > galleryLimit){
    html += `<button class="btn load-more" onclick="galleryLimit+=60; render();">${t('inv.load_more').replace('{n}', withPhoto.length - galleryLimit)}</button>`;
  }
  return html;
}
let viewHistory = [];

function pushHistory(){
  viewHistory.push(JSON.parse(JSON.stringify(view)));
  if(viewHistory.length>60) viewHistory.shift();
}
function goBack(){
  if(!viewHistory.length) return;
  view = viewHistory.pop();
  render();
}

function renderNav(){
  const items = NAV.map(n=>`<button class="navitem ${view.page===n.id?'active':''}" onclick="goPage('${n.id}')"><span class="navicon">${n.icon}</span><span>${t(n.labelKey)}</span></button>`).join('');
  document.getElementById('bottomnav').innerHTML = items;
  document.getElementById('topnav').innerHTML = items;
}

async function render(){
  const scrollY = window.scrollY;
  renderNav();
  renderCrumbs();
  const fabBack = document.getElementById('fabBack');
  if(fabBack) fabBack.style.display = viewHistory.length ? 'flex' : 'none';
  const p = document.getElementById('panel');
  p.innerHTML = `<div class="loading-note">Cargando…</div>`;
  let html = '';
  if(view.page==='dashboard') html = renderDashboard();
  else if(view.page==='coleccion') html = await renderColeccion();
  else if(view.page==='inventario') html = await renderInventario();
  else if(view.page==='estadisticas') html = renderEstadisticas();
  else if(view.page==='investigacion') html = renderInvestigacion();
  else if(view.page==='ayuda') html = renderAyuda();
  else if(view.page==='backup') html = renderBackup();
  else if(view.page==='gallery') html = await renderGallery();
  p.innerHTML = html;
  updateFab();
  if(tourActive) advanceTourIfDone();
  requestAnimationFrame(()=>{ animateBars(); window.scrollTo(0, scrollY); });
}

/* Botón flotante "+" — te sigue por la pantalla para no tener que bajar
   hasta el final de la página cada vez que quieres añadir algo. Su acción
   depende de dónde estés navegando en ese momento. */
function updateFab(){
  const fab = document.getElementById('fab');
  if(!fab) return;
  if(view.page==='coleccion' && view.platformId && !view.productId){
    fab.style.display = 'flex';
    fab.title = 'Añadir producto nuevo en esta plataforma';
  } else if(view.page==='coleccion' && view.categoryId && !view.platformId && !view.productId){
    fab.style.display = 'flex';
    fab.title = 'Añadir plataforma/consola nueva';
  } else {
    fab.style.display = 'none';
  }
}
function fabAction(){
  if(view.page==='coleccion' && view.platformId && !view.productId){
    addProductToPlatform(view.categoryId, view.platformId, view.folderId||null);
  } else if(view.page==='coleccion' && view.categoryId && !view.platformId){
    addPlatformToCategory(view.categoryId);
  }
}

function goPage(id){ pushHistory(); view = { page:id }; render(); }

/* Búsqueda local del Dashboard — actualiza solo el bloque de resultados,
   sin recargar toda la página, para que se sienta instantánea al teclear. */
function handleDashboardSearch(q){
  const el = document.getElementById('dash-search-results');
  if(!el) return;
  q = (q||'').trim().toLowerCase();
  if(!q){ el.innerHTML = ''; return; }
  const matches = PRODUCTS.filter(p=>
    p.name.toLowerCase().includes(q) || (p.platformName||'').toLowerCase().includes(q)
      || (p.notes||'').toLowerCase().includes(q) || (p.summary||'').toLowerCase().includes(q)
  ).slice(0, 15);
  if(!matches.length){
    el.innerHTML = `<div class="section-sub">${t('dash.no_results').replace('{q}', q)}</div>`;
    return;
  }
  el.innerHTML = matches.map(p=>`
    <div class="search-hit" onclick="goProduct('${p.id}')">
      <div class="search-hit-name">${p.name}</div>
      <div class="search-hit-meta">${p.platformName||''}${p.year?' · '+p.year:''}</div>
    </div>`).join('');
}
function goCategory(catId){ pushHistory(); view = { page:'coleccion', categoryId:catId }; render(); }
function goPlatform(catId, platId){ pushHistory(); view = { page:'coleccion', categoryId:catId, platformId:platId }; render(); }
function goFolder(catId, platId, folderId){ pushHistory(); view = { page:'coleccion', categoryId:catId, platformId:platId, folderId:folderId }; render(); }
function goProduct(prodId){ pushHistory(); view = Object.assign({}, view, { page:'coleccion', productId:prodId }); render(); }

function renderCrumbs(){
  const c = document.getElementById('crumbs');
  // Cuando estás en el nivel de arriba de una pantalla (sin categoría, ni
  // producto abierto) no hace falta repetir el nombre de la página aquí —
  // ya lo dice la barra de navegación y el propio título de la pantalla.
  if(!view.categoryId && !view.productId){ c.innerHTML = ''; return; }
  let parts = [];
  const navMatch = NAV.find(n=>n.id===view.page);
  const navLabel = (navMatch ? t(navMatch.labelKey) : '') || (view.page==='backup' ? t('backup.kicker') : '');
  parts.push(view.categoryId||view.productId ? `<button onclick="goPage('${view.page}')">${navLabel}</button>` : `<span class="current">${navLabel}</span>`);
  if(view.categoryId){
    const cat = getAllCategories().find(c2=>c2.id===view.categoryId);
    if(cat){
      parts.push(`<span class="sep">/</span>`);
      parts.push(view.platformId||view.productId ? `<button onclick="goCategory('${cat.id}')">${cat.name}</button>` : `<span class="current">${cat.name}</span>`);
    }
  }
  if(view.platformId){
    const plat = getAllPlatforms().find(p=>p.id===view.platformId);
    if(plat){
      parts.push(`<span class="sep">/</span>`);
      parts.push((view.productId||view.folderId) ? `<button onclick="goPlatform('${view.categoryId}','${plat.id}')">${plat.name}</button>` : `<span class="current">${plat.name}</span>`);
    }
  }
  if(view.folderId){
    const folder = foldersForPlatform(view.platformId).find(f=>f.id===view.folderId);
    if(folder){
      parts.push(`<span class="sep">/</span>`);
      parts.push(view.productId ? `<button onclick="goFolder('${view.categoryId}','${view.platformId}','${folder.id}')">${folder.name}</button>` : `<span class="current">${folder.name}</span>`);
    }
  }
  if(view.productId){
    const prod = PRODUCTS_BY_ID[view.productId];
    if(prod) parts.push(`<span class="sep">/</span><span class="current">${prod.name}</span>`);
  }
  c.innerHTML = parts.join('');
}

function animateBars(){
  document.querySelectorAll('.bar-fill[data-pct]').forEach(el=>{
    const pct = el.getAttribute('data-pct');
    requestAnimationFrame(()=>{ el.style.width = pct + '%'; });
  });
  document.querySelectorAll('.ring[data-pct]').forEach(el=>{
    const pct = el.getAttribute('data-pct');
    el.style.setProperty('--p','0%');
    requestAnimationFrame(()=>{ el.style.setProperty('--p', pct+'%'); });
  });
}

  const g = computeGlobalStats();
  const cats = statsByCategory();

  let html = `
  <div class="kicker"><span class="dot"></span> ${t('dash.kicker')}</div>
  <input type="text" class="h1-edit" value="${title.toString().replace(/"/g,'&quot;')}" onchange="updateDashboardTitle(this.value)" title="Toca para cambiar este título">
  <div class="field" style="margin-bottom:14px;"><input type="text" id="dash-search" placeholder="${t('dash.search')}" oninput="handleDashboardSearch(this.value)" autocomplete="off"></div>

  <div class="hero-wrap">
    <div class="ring ring-hero" data-pct="${g.pct}"><div class="ring-hole"><div class="ring-hero-pct">${g.pct}%</div></div></div>
    <div class="ring-hero-sub">${g.have} / ${g.total} ${t('dash.pieces')}</div>
  </div>

  <div class="stat-strip">
    <div class="stat"><div class="stat-label">${t('dash.pending')}</div><div class="stat-value">${g.pending}</div><div class="stat-sub">${t('dash.pending.sub')}</div></div>
    <div class="stat"><div class="stat-label">${t('dash.value')}</div><div class="stat-value" style="font-size:16px;">${g.valor.toLocaleString('es-ES')} ${currencySymbol()}</div><div class="stat-sub">${g.lastUpdate?(t('dash.value.updated').replace('{d}',g.lastUpdate)):t('dash.value.novalue')}</div></div>
  </div>
  <h3>${t('dash.progress')}</h3>`;
  cats.forEach(c=>{
    html += `<div class="prow" onclick="goCategory('${c.id}')">
      <div class="prow-top"><span class="prow-name">${c.name}</span><span class="prow-pct">${c.total?c.have+'/'+c.total+' · '+c.pct+'%':'—'}</span></div>
      <div class="microbar"><div class="microbar-fill" style="width:${c.pct}%;"></div></div>

    <button class="btn" onclick="goPage('backup')">${icon('gear')} ${t('dash.backup_link')}</button>
  </div>`;
  return html;
}

/* Color de insignia estable por plataforma (mismo id → mismo color siempre) */
function badgeColorFor(id){
  const palette = ['navy','sage','brick','gold'];
  let hash = 0;
  for(let i=0;i<id.length;i++) hash = (hash*31 + id.charCodeAt(i)) >>> 0;
  return palette[hash % palette.length];
}

async function renderPlatformProducts(catId, platId){
  const plat = getAllPlatforms().find(p=>p.id===platId);
  const allProds = PRODUCTS.filter(p=>p.platformId===platId);
  const prods = sortProductsByMode(allProds.filter(p=>!p.folderId));
  const folders = foldersForPlatform(platId);
  let html = `<div class="kicker"><span class="dot"></span> ${plat.year} · ${plat.maker}</div>`;
  html += `<input type="text" class="h1-edit" value="${plat.name.toString().replace(/"/g,'&quot;')}" onchange="renamePlatform('${platId}',this.value)" title="Toca para renombrar esta plataforma">`;
  if(plat.note) html += `<div class="real-note">${plat.note}</div>`;
  html += sortSelectorHTML();

  if(folders.length){
    folders.forEach(f=>{
      const fProds = allProds.filter(p=>p.folderId===f.id);
      const st = computeStatsFor(fProds.map(p=>({product:p, edition:p})));
      html += `<div class="plat-card" onclick="goFolder('${catId}','${platId}','${f.id}')">
        <div class="plat-badge navy">${icon('folder')}</div>
        <div class="plat-card-body">
          <div class="plat-name-lg">${f.name}</div>
          <div class="plat-card-bottom"><div class="microbar"><div class="microbar-fill" style="width:${st.pct}%;"></div></div><span class="plat-pct-lg">${st.total ? st.pct+'%' : '—'}</span></div>
        </div>
      </div>`;
    });
  }

  if(prods.length===0 && folders.length===0){
    html += `<div class="empty-state"><p>${t('plat.empty')}</p></div>`;
  } else if(prods.length){
    html += `<div class="title-grid">`;
    const photos = await Promise.all(prods.map(p=>Promise.all([loadMainFront(p.id), loadMainBack(p.id)])));
    prods.forEach((p,i)=> html += productCardHTML(p, photos[i][0], photos[i][1]));
    html += `</div>`;
  }

  const counts = platformCountsInCollection(platId);
  html += `<button class="btn" style="margin-top:18px;" onclick="togglePlatformCounts('${platId}')">${counts ? t('plat.counts_yes') : t('plat.counts_no')}</button>`;
  html += `<div style="text-align:center;margin-top:22px;"><button class="btn" id="tour-add-folder" style="font-size:9.5px;opacity:0.7;border-style:dashed;" onclick="addFolder('${catId}','${platId}')">${icon('folder')} ${t('common.create_folder')}</button></div>`;
  html += `<h3>${t('common.danger_zone')}</h3>
  <button class="btn" style="border-color:var(--brick);color:var(--brick);" onclick="deletePlatform('${catId}','${platId}')">${icon('trash')} ${t('common.delete_platform').replace('{n}', allProds.length)}</button>`;
  return html;
}

async function renderFolderProducts(catId, platId, folderId){
  const plat = getAllPlatforms().find(p=>p.id===platId);

  if(!folder){ return renderPlatformProducts(catId, platId); }
  const prods = sortProductsByMode(PRODUCTS.filter(p=>p.platformId===platId && p.folderId===folderId));
  let html = `<div class="kicker"><span class="dot"></span> ${plat.name} · ${t('folder.kicker')}</div>`;

    prods.forEach((p,i)=> html += productCardHTML(p, photos[i][0], photos[i][1]));

/* Orden de los productos dentro de una plataforma/carpeta — el usuario elige
   entre año (con desempate alfabético, el criterio de siempre), alfabético
   puro, o si lo tiene primero (también con desempate alfabético dentro). */
let productSortMode = 'year';
function sortProductsByMode(list){
  if(productSortMode==='alpha') return list.slice().sort((a,b)=> (a.name||'').localeCompare(b.name||'','es',{sensitivity:'base'}));
  if(productSortMode==='have') return list.slice().sort((a,b)=>{
    const ah = a.possession==='tengo' ? 0 : 1, bh = b.possession==='tengo' ? 0 : 1;
    if(ah!==bh) return ah-bh;
    return (a.name||'').localeCompare(b.name||'','es',{sensitivity:'base'});
  });
  return sortGames(list);
}
function setProductSortMode(mode){
  productSortMode = mode;
  render();
}
function sortSelectorHTML(){
  return `<div class="field" style="margin-bottom:10px;"><label>${t('sort.label')}</label><select onchange="setProductSortMode(this.value)">
    <option value="year" ${productSortMode==='year'?'selected':''}>${t('sort.year')}</option>
    <option value="alpha" ${productSortMode==='alpha'?'selected':''}>${t('sort.alpha')}</option>
    <option value="have" ${productSortMode==='have'?'selected':''}>${t('sort.have')}</option>
  </select></div>`;
}

function productCardHTML(p, frontPhoto, backPhoto){

/* Color del botón de posesión: verde si lo tienes, amarillo pastel si
   además está sellado (para distinguirlo de un vistazo sin entrar), y
   neutro si no lo tienes. */
function possessClass(p){
  if(p.possession!=='tengo') return 'tone-not-have';
  return p.sealed ? 'tone-sealed' : 'tone-have';
}
function possessLabel(p){
  return p.possession==='tengo' ? t('p.have_yes') : t('p.have_no');
}

/* Botón de posesión grande — la acción más habitual, disponible sin tener
   que entrar en la ficha a editar. Alterna entre tengo/no lo tengo; los
   estados intermedios (en camino, reservado…) se afinan dentro de la ficha. */
async function quickTogglePossession(id){
  const rec = EDITIONS_BY_ID[id]; if(!rec) return;
  const next = rec.edition.possession === 'tengo' ? 'no' : 'tengo';
  rec.edition.possession = next;
  await setEditionField(id, 'possession', next);
  const btn = document.getElementById('possess_'+id);
  if(btn){
    btn.classList.remove('tone-have','tone-not-have','tone-sealed');
    btn.classList.add(possessClass(rec.edition));
    btn.textContent = possessLabel(rec.edition);
  }
  refreshCompletoBadge(id);
}

   selector de archivos. Subir/cambiar fotos vive únicamente en la pestaña

function flipViewHTML(front, back, widthPx){

}

/* click / tap para voltear la tarjeta (funciona en cualquier .flip-card,
   incluida la foto principal en la rejilla, sin entrar a la ficha) */
function attachFlipHandlers(){
  const panel = document.getElementById('panel');
  let touchStart = null;
  let pinch = null; // { img0, initialDist }
  panel.addEventListener('click', (e)=>{
    const card = e.target.closest('.flip-card');
    if(!card) return;
    // Voltear nunca debe activar el onclick de la tarjeta/fila que lo envuelve
    // (por ejemplo, abrir la ficha del juego desde la rejilla o el inventario)
    e.preventDefault();
    e.stopPropagation();
    if(card.dataset.justSwiped==='1'){ card.dataset.justSwiped=''; return; }
    card.classList.toggle('flipped');
  }, true);
  panel.addEventListener('touchstart', (e)=>{
    const card = e.target.closest('.flip-card');
    if(!card) return;
    if(e.touches.length>=2){
      // Pellizcar con dos dedos: amplía temporalmente la foto en grande,
      // centrada en el punto exacto donde has puesto los dedos — sin
      // interferir con el volteo (que usa un solo dedo).
      touchStart = null;
      const face = card.classList.contains('flipped') ? card.querySelector('.flip-back img') : card.querySelector('.flip-front img');
      if(!face) return;
      const rect = card.getBoundingClientRect();
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const originX = rect.width ? Math.min(100, Math.max(0, ((midX - rect.left) / rect.width) * 100)) : 50;
      const originY = rect.height ? Math.min(100, Math.max(0, ((midY - rect.top) / rect.height) * 100)) : 50;
      openPinchZoom(face.src, originX, originY);
      pinch = { dist: pinchDistance(e.touches) };
      return;
    }
    const t = e.touches[0];
    touchStart = { card, x:t.clientX, y:t.clientY };
  }, {passive:true});
  panel.addEventListener('touchmove', (e)=>{
    if(!pinch) return;
    e.preventDefault();
    const d = pinchDistance(e.touches);
    const scale = Math.min(4, Math.max(1, d / pinch.dist));
    setPinchScale(scale);
  }, {passive:false});
  panel.addEventListener('touchend', (e)=>{
    if(pinch){
      if(e.touches.length<2){ closePinchZoom(); pinch = null; }
      return;
    }
    if(!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if(Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)*1.4){
      touchStart.card.dataset.justSwiped = '1';
      if(dx>0) touchStart.card.classList.add('flipped');
      else touchStart.card.classList.remove('flipped');
    }
    touchStart = null;
  }, {passive:true});
}

/* Zoom temporal de la foto — solo mientras mantienes el pellizco con dos
   dedos; al soltar, vuelve a su tamaño normal. No cambia nada guardado. */
function pinchDistance(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy) || 1;
}
function openPinchZoom(src, originX, originY){
  const overlay = document.getElementById('pinchOverlay');
  const img = document.getElementById('pinchImg');
  if(!overlay || !img || !src) return;
  img.src = src;
  img.style.transformOrigin = (originX!==undefined ? originX : 50) + '% ' + (originY!==undefined ? originY : 50) + '%';
  img.style.transform = 'scale(1)';
  overlay.style.display = 'flex';
}
function setPinchScale(scale){
  const img = document.getElementById('pinchImg');
  if(img) img.style.transform = 'scale(' + scale + ')';
}
function closePinchZoom(){
  const overlay = document.getElementById('pinchOverlay');
  if(overlay) overlay.style.display = 'none';
}

/* ----- Field update handlers: mutan en memoria + guardan, y solo refrescan
   en pantalla lo estrictamente necesario — nunca recargan toda la página,
   así que puedes ir marcando checks sin que se te cierre nada. ----- */
async function updateProductField(id, field, value){
  const p = PRODUCTS_BY_ID[id]; if(p) p[field]=value;
  await setProductField(id, field, value);
  if(['existence','standalone','dlc','special'].includes(field)) refreshProductMeta(id);
}
async function toggleProductFlag(id, field, checked){
  await updateProductField(id, field, checked);
}
async function updateResearchField(id, field, value){
  const p = PRODUCTS_BY_ID[id]; if(!p) return;
  const r = Object.assign({sabemos:'',falta:'',fuentes:'',notas:''}, p.research||{}, {[field]:value});
  p.research = r;
  await setProductField(id, 'research', r);
}
async function updateEditionField(id, field, value){
  const rec = EDITIONS_BY_ID[id]; if(rec) rec.edition[field]=value;
  await setEditionField(id, field, value);
  if(field==='possession'){
    refreshCompletoBadge(id);
    const btn = document.getElementById('possess_'+id);
    if(btn && rec){
      btn.classList.remove('tone-have','tone-not-have','tone-sealed');
      btn.classList.add(possessClass(rec.edition));
      btn.textContent = possessLabel(rec.edition);
    }
  } else if(field==='sealed'){
    await syncPossessionFromChecklist(id);
  }
}
/* Si al menos una casilla del checklist está marcada, o está sellado, se
   considera que lo tienes; si no hay ninguna marcada, no lo tienes. Se
   recalcula cada vez que cambia una casilla o el sellado. */
async function syncPossessionFromChecklist(id){
  const rec = EDITIONS_BY_ID[id]; if(!rec) return;
  const e = rec.edition;
  const anyChecked = checklistForCategory(e.categoryId).some(item=> !!e.components[item.key]) || !!e.sealed;
  const next = anyChecked ? 'tengo' : 'no';
  if(e.possession === next) return;
  e.possession = next;
  await setEditionField(id, 'possession', next);
  const btn = document.getElementById('possess_'+id);
  if(btn){
    btn.classList.remove('tone-have','tone-not-have','tone-sealed');
    btn.classList.add(possessClass(e));
    btn.textContent = possessLabel(e);
  }
}
async function updateComponent(id, field, value){
  const rec = EDITIONS_BY_ID[id]; if(rec) rec.edition.components[field]=value;
  await setEditionNested(id,'components',field,value);
  refreshCompletoBadge(id);
  await syncPossessionFromChecklist(id);
}
async function updateConservation(id, field, value){
  const v = (field==='notas') ? value : (value===''?null:Number(value));
  const rec = EDITIONS_BY_ID[id]; if(rec) rec.edition.conservation[field]=v;
  await setEditionNested(id,'conservation',field,v);
}
async function updateValuation(id, field, value){
  const numeric = ['valorAdquisicion','valorActual'].includes(field);
  const v = numeric ? (value===''?null:Number(value)) : value;
  const rec = EDITIONS_BY_ID[id]; if(rec) rec.edition.valuation[field]=v;
  await setEditionNested(id,'valuation',field,v);
  if(field==='valorActual'){
    const hoy = new Date().toISOString().slice(0,10);
    if(rec) rec.edition.valuation.fechaActualizacion = hoy;
    await setEditionNested(id,'valuation','fechaActualizacion',hoy);
    render();
  }
}
async function updateObjetivo(id, field, value){
  const v = (field==='precioMax') ? (value===''?null:Number(value)) : value;
  const rec = EDITIONS_BY_ID[id]; if(rec) rec.edition.objetivo[field]=v;
  await setEditionNested(id,'objetivo',field,v);
}

async function markComplete(id){
  const rec = EDITIONS_BY_ID[id]; if(!rec) return;
  const e = rec.edition;
  const fields = checklistForCategory(e.categoryId).map(item=>item.key);
  fields.forEach(f=> e.components[f]=true);
  e.possession = 'tengo';
  if(!OVERRIDES.products[id]) OVERRIDES.products[id] = {};
  OVERRIDES.products[id].components = Object.assign({}, OVERRIDES.products[id].components||{}, e.components);
  OVERRIDES.products[id].possession = 'tengo';
  await persistOverrides();
  fields.forEach(f=>{ const el=document.getElementById('chk_'+id+'_'+f); if(el) el.checked=true; });
  refreshCompletoBadge(id);
}

function refreshCompletoBadge(id){
